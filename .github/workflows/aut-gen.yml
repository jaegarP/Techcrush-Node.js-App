name: Abacus AI Code Generator
on:
  workflow_dispatch: # Allows you to manually trigger this from the GitHub Actions UI

jobs:
  run-abacus:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 Crucial: Gives the runner permission to push code updates
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install abacusai

      - name: Generate Code via Abacus.AI
        env:
          # Securely map your Abacus API key from your repository secrets
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python .github/scripts/generate.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # This line ensures the runner won't fail if no code files were modified
          git diff-index --quiet HEAD || git commit -m "Automated updates from Abacus.AI ChatLLM"
          git push
